name: Run SRE lab 03

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Activate lab-03, or restore its node and application configuration"
        required: true
        type: choice
        options:
          - activate
          - restore

permissions:
  contents: read
  id-token: write

# Serialize with Terraform Provision/Decommission for this lab.
concurrency:
  group: terraform-eks-lab-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  EXPECTED_ACCOUNT: "490224159848"
  CLUSTER_NAME: eks-learning-lab-lab-eks
  ECR_REPOSITORY: simple-test
  KUBECONFIG: ${{ github.workspace }}/.simple-test-kubeconfig

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/TerraformSRELabGitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS prerequisites
        run: |
          aws sts get-caller-identity | jq -e --arg account "$EXPECTED_ACCOUNT" '.Account == $account'
          aws eks describe-cluster --name "$CLUSTER_NAME" > "$RUNNER_TEMP/cluster.json"
          jq -e '.cluster.status == "ACTIVE"' "$RUNNER_TEMP/cluster.json"
          CLUSTER_VERSION=$(jq -r '.cluster.version' "$RUNNER_TEMP/cluster.json")
          [[ "$CLUSTER_VERSION" =~ ^1\.[0-9]+$ ]]
          echo "CLUSTER_VERSION=$CLUSTER_VERSION" >> "$GITHUB_ENV"

      - name: Install matching kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          [[ "$KUBECTL_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          cd "$RUNNER_TEMP/kubectl-bin"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/kubectl-bin" >> "$GITHUB_PATH"

      - name: Apply lab operation
        env:
          LAB_OPERATION: ${{ inputs.operation }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          python3 scripts/sre/lab03.py "$LAB_OPERATION"

      - name: Verify restored application
        if: ${{ inputs.operation == 'restore' }}
        run: |
          kubectl -n simple-test rollout status deployment/simple-test --timeout=360s
          kubectl -n simple-test port-forward service/simple-test 18081:80 > "$RUNNER_TEMP/http-forward.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18081/healthz
          curl --fail --silent --show-error http://127.0.0.1:18081/ | grep -q 'simple-test is running'
          # Keep recovery data until rollout and HTTP validation both pass.
          kubectl -n simple-test delete configmap sre-lab-03-recovery --ignore-not-found
          echo 'Lab-03 restored; rollout and HTTP verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary kubeconfig
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
