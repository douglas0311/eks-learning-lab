# Applied once by a cluster administrator, not by the deployment workflow.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simple-test-deployer
  namespace: simple-test
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simple-test-deployer
  namespace: simple-test
subjects:
  - kind: Group
    name: simple-test-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: simple-test-deployer
  apiGroup: rbac.authorization.k8s.io
