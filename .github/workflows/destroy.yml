name: Terraform Decommission

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks-lab-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  EXPECTED_ACCOUNT: "490224159848"
  STATE_BUCKET: douglas-sre-s3-terraform-state
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/TerraformSRELabGitHubActionsRole
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity > "$RUNNER_TEMP/aws-identity.json"
          cat "$RUNNER_TEMP/aws-identity.json"
          jq -e --arg account "$EXPECTED_ACCOUNT" '.Account == $account' "$RUNNER_TEMP/aws-identity.json"

      - name: Verify existing state bucket
        run: |
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" --expected-bucket-owner "$EXPECTED_ACCOUNT"; then
            echo "::error::The state bucket is missing or inaccessible. Decommission stopped; this workflow never creates buckets."
            exit 1
          fi
          aws s3api get-bucket-location --bucket "$STATE_BUCKET" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.LocationConstraint == null'
          aws s3api get-bucket-versioning --bucket "$STATE_BUCKET" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.Status == "Enabled"'
          aws s3api get-public-access-block --bucket "$STATE_BUCKET" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls == true and .IgnorePublicAcls == true and .BlockPublicPolicy == true and .RestrictPublicBuckets == true'

      - name: Require existing remote state
        run: |
          if ! aws s3api head-object --bucket "$STATE_BUCKET" --key eks-lab/terraform.tfstate --expected-bucket-owner "$EXPECTED_ACCOUNT" > /dev/null; then
            echo "::error::Remote Terraform state is missing or inaccessible. Refusing to destroy from an empty state."
            exit 1
          fi

      - name: Initialize Terraform S3 backend
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate

      # Remove controller-managed Ingress resources while its controller and VPC still exist.
      - name: Clean up lab 05 before Terraform teardown
        env:
          KUBECONFIG: ${{ runner.temp }}/lab05-cleanup-kubeconfig
        run: |
          trap 'rm -f "$KUBECONFIG"' EXIT
          if ! aws eks describe-cluster --name eks-learning-lab-lab-eks > "$RUNNER_TEMP/cleanup-cluster.json" 2> "$RUNNER_TEMP/cleanup-cluster.err"; then
            if grep -q 'ResourceNotFoundException' "$RUNNER_TEMP/cleanup-cluster.err"; then
              echo "Cluster already absent; no Kubernetes cleanup can run."
              exit 0
            fi
            cat "$RUNNER_TEMP/cleanup-cluster.err" >&2
            exit 1
          fi
          CLUSTER_VERSION=$(jq -r '.cluster.version' "$RUNNER_TEMP/cleanup-cluster.json")
          [[ "$CLUSTER_VERSION" =~ ^1\.[0-9]+$ ]]
          KUBECTL_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          [[ "$KUBECTL_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/lab05-kubectl"
          (
            cd "$RUNNER_TEMP/lab05-kubectl"
            curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
            curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
            chmod +x kubectl
          )
          export PATH="$RUNNER_TEMP/lab05-kubectl:$PATH"
          aws eks update-kubeconfig --name eks-learning-lab-lab-eks --kubeconfig "$KUBECONFIG"
          python3 scripts/sre/lab05.py cleanup

      - name: Terraform destroy plan
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan

      - name: Apply Terraform destroy plan
        id: destroy
        run: terraform apply -input=false -lock-timeout=5m destroy.tfplan

      - name: Preserve diagnostic state in S3
        if: ${{ always() && (steps.destroy.outcome == 'success' || steps.destroy.outcome == 'failure') }}
        env:
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
        run: |
          umask 077
          SNAPSHOT="$RUNNER_TEMP/diagnostic.tfstate"
          # A failed backend write can leave a newer emergency state on the runner.
          # Preserve it separately; never overwrite the backend with a manual copy.
          if [[ -s errored.tfstate ]]; then
            cp errored.tfstate "$SNAPSHOT"
            STATE_SOURCE="local recovery state (backend persistence failed)"
          else
            if ! terraform state pull > "$SNAPSHOT"; then
              echo "::error::Could not export state for diagnostics. Inspect backend access and Terraform errors."
              exit 1
            fi
            STATE_SOURCE="remote backend snapshot"
          fi
          jq -e 'type == "object" and has("version") and has("serial")' "$SNAPSHOT" > /dev/null
          DESTINATION="s3://$STATE_BUCKET/diagnostics/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/terraform.tfstate"
          if ! aws s3 cp "$SNAPSHOT" "$DESTINATION" --sse AES256 --only-show-errors; then
            echo "::error::Diagnostic backup could not be saved to S3. Do not assume recovery state was preserved."
            exit 1
          fi
          printf 'Destroy outcome: %s\n\nState source: %s\n\nPrivate diagnostic copy: `%s`\n\nPrimary state: `s3://%s/eks-lab/terraform.tfstate`\n' \
            "$DESTROY_OUTCOME" "$STATE_SOURCE" "$DESTINATION" "$STATE_BUCKET" >> "$GITHUB_STEP_SUMMARY"

      - name: Report decommission failure
        if: ${{ failure() }}
        run: |
          echo "::error::Decommission failed. Review the first failed step. Partial infrastructure may remain; use the shared S3 state to diagnose and recover."
          echo "No rollback or bucket creation is performed. State backup results are shown in the diagnostic step." >> "$GITHUB_STEP_SUMMARY"
