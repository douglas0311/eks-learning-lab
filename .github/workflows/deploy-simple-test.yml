name: Deploy simple-test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialize with Terraform Provision/Decommission for this lab.
concurrency:
  group: terraform-eks-lab-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  EXPECTED_ACCOUNT: "490224159848"
  CLUSTER_NAME: eks-learning-lab-lab-eks
  ECR_REPOSITORY: simple-test
  KUBECONFIG: ${{ github.workspace }}/.simple-test-kubeconfig

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/GitHubActionsSimpleTestRole
          aws-region: us-east-1

      - name: Verify AWS prerequisites
        run: |
          aws sts get-caller-identity | jq -e --arg account "$EXPECTED_ACCOUNT" '.Account == $account'
          aws eks describe-cluster --name "$CLUSTER_NAME" > "$RUNNER_TEMP/cluster.json"
          jq -e '.cluster.status == "ACTIVE"' "$RUNNER_TEMP/cluster.json"
          CLUSTER_VERSION=$(jq -r '.cluster.version' "$RUNNER_TEMP/cluster.json")
          [[ "$CLUSTER_VERSION" =~ ^1\.[0-9]+$ ]]
          echo "CLUSTER_VERSION=$CLUSTER_VERSION" >> "$GITHUB_ENV"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > "$RUNNER_TEMP/ecr.json"
          jq -e '.repositories[0].imageTagMutability == "IMMUTABLE"' "$RUNNER_TEMP/ecr.json"
          ECR_URI=$(jq -r '.repositories[0].repositoryUri' "$RUNNER_TEMP/ecr.json")
          [[ "$ECR_URI" == "$EXPECTED_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY" ]]
          echo "ECR_URI=$ECR_URI" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install matching kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          [[ "$KUBECTL_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          cd "$RUNNER_TEMP/kubectl-bin"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/kubectl-bin" >> "$GITHUB_PATH"

      - name: Verify Kubernetes access and metrics
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          kubectl auth can-i create deployments.apps -n simple-test | grep -qx yes
          kubectl auth can-i create services -n simple-test | grep -qx yes
          kubectl auth can-i create horizontalpodautoscalers.autoscaling -n simple-test | grep -qx yes
          kubectl get --raw /apis/metrics.k8s.io/v1beta1/namespaces/simple-test/pods > /dev/null
          EXISTING=$(kubectl -n simple-test get deployment simple-test --ignore-not-found -o name)
          if [[ -n "$EXISTING" ]]; then
            echo "::error::simple-test already exists. This initial-deployment workflow does not update an existing application."
            exit 1
          fi

      - name: Build and smoke-test container
        run: |
          docker build --platform linux/amd64 -t "$ECR_URI:$IMAGE_TAG" application/simple-test
          docker run -d --name simple-test-smoke \
            --read-only --tmpfs /tmp:rw,size=33554432,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            --memory 64m --cpus 0.1 \
            -p 127.0.0.1:18080:80 "$ECR_URI:$IMAGE_TAG"
          trap 'docker logs simple-test-smoke; docker rm -f simple-test-smoke' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q 'simple-test is running'

      - name: Publish image to existing ECR repository
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/simple-test-docker"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          aws ecr get-login-password | docker login --username AWS --password-stdin "$EXPECTED_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          docker push "$ECR_URI:$IMAGE_TAG"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_URI=$ECR_URI@$DIGEST" >> "$GITHUB_ENV"

      - name: Deploy application manifests
        run: |
          kubectl kustomize kubernetes/simple-test \
            | sed "s|SIMPLE_TEST_IMAGE|$IMAGE_URI|g" > "$RUNNER_TEMP/simple-test.yaml"
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/simple-test.yaml"
          kubectl apply -f "$RUNNER_TEMP/simple-test.yaml"
          kubectl -n simple-test rollout status deployment/simple-test --timeout=300s
          kubectl -n simple-test wait --for=condition=ScalingActive hpa/simple-test --timeout=180s

      - name: Verify HTTP response
        run: |
          kubectl -n simple-test port-forward service/simple-test 18081:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:18081/healthz
          curl --fail --silent --show-error http://127.0.0.1:18081/ | grep -q 'simple-test is running'
          kubectl -n simple-test get deployment,pods,service,hpa
          printf 'Deployed `%s` to `%s`, namespace `simple-test`. Service port: 80 (ClusterIP).\n' "$IMAGE_URI" "$CLUSTER_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n simple-test get deployment,pods,service,hpa || true
            kubectl -n simple-test get events --sort-by=.lastTimestamp || true
            kubectl -n simple-test describe hpa simple-test || true
          fi
          echo "::error::Deployment failed. Partial resources and pushed images are retained for diagnosis; no automatic rollback is performed."

      - name: Remove temporary kubeconfig
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
