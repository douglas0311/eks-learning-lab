name: "SRE labs (current: 06)"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Lab 06 is current; previous labs remain available for recovery or review"
        required: true
        default: lab-06
        type: choice
        options:
          - lab-06
          - lab-05.2
          - lab-05.1
          - lab-05
          - lab-04
          - lab-03
      operation:
        description: "Choose an operation; lab-03 supports activate/restore, lab-04 also supports check"
        required: true
        type: choice
        options:
          - activate
          - restore
          - check
          - cleanup

permissions:
  contents: read
  id-token: write

# Serialize with Terraform Provision/Decommission for this lab.
concurrency:
  group: terraform-eks-lab-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  EXPECTED_ACCOUNT: "490224159848"
  CLUSTER_NAME: eks-learning-lab-lab-eks
  ECR_REPOSITORY: simple-test
  KUBECONFIG: ${{ github.workspace }}/.simple-test-kubeconfig

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected lab operation
        env:
          LAB_SCENARIO: ${{ inputs.scenario }}
          LAB_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/sre/dispatch_lab.py "$LAB_SCENARIO" "$LAB_OPERATION" --validate-only

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/TerraformSRELabGitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS prerequisites
        run: |
          aws sts get-caller-identity | jq -e --arg account "$EXPECTED_ACCOUNT" '.Account == $account'
          aws eks describe-cluster --name "$CLUSTER_NAME" > "$RUNNER_TEMP/cluster.json"
          jq -e '.cluster.status == "ACTIVE"' "$RUNNER_TEMP/cluster.json"
          CLUSTER_VERSION=$(jq -r '.cluster.version' "$RUNNER_TEMP/cluster.json")
          [[ "$CLUSTER_VERSION" =~ ^1\.[0-9]+$ ]]
          echo "CLUSTER_VERSION=$CLUSTER_VERSION" >> "$GITHUB_ENV"

      - name: Install matching kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          [[ "$KUBECTL_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          cd "$RUNNER_TEMP/kubectl-bin"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/kubectl-bin" >> "$GITHUB_PATH"

      - name: Apply lab operation
        env:
          LAB_OPERATION: ${{ inputs.operation }}
          LAB_SCENARIO: ${{ inputs.scenario }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          python3 scripts/sre/dispatch_lab.py "$LAB_SCENARIO" "$LAB_OPERATION"

      - name: Remove temporary kubeconfig
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
