name: Create S3 bucket

on:
  workflow_dispatch:
    inputs:
      bucket_suffix:
        description: "Bucket suffix only (for example: terraform-state); douglas-sre- is added automatically"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: s3-bucket-douglas-sre-${{ inputs.bucket_suffix }}
  cancel-in-progress: false

jobs:
  create_bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BUCKET_PREFIX: douglas-sre-
      BUCKET_SUFFIX: ${{ inputs.bucket_suffix }}
      AWS_REGION: us-east-1
      AWS_PAGER: ""
      EXPECTED_ACCOUNT: "490224159848"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bucket name and lifecycle configuration
        run: |
          BUCKET_NAME="${BUCKET_PREFIX}${BUCKET_SUFFIX}"
          if [[ ${#BUCKET_NAME} -gt 63 || ! "$BUCKET_SUFFIX" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::Use a suffix containing lowercase letters, numbers or hyphens; start and end with a letter or number. The full bucket name must not exceed 63 characters."
            exit 1
          fi
          case "$BUCKET_NAME" in
            *-s3alias|*--ol-s3|*--x-s3|*--table-s3)
              echo "::error::The bucket name uses a reserved S3 suffix."
              exit 1
              ;;
          esac
          jq -e '.Rules | type == "array" and length > 0' Rules/s3-lifecycle.json > /dev/null
          echo "BUCKET_NAME=$BUCKET_NAME" >> "$GITHUB_ENV"
          echo "Bucket name: $BUCKET_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/GitHubActionsS3LabRole
          aws-region: us-east-1
          allowed-account-ids: "490224159848"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check that the bucket does not exist
        run: |
          if aws s3api head-bucket --bucket "$BUCKET_NAME" > /dev/null 2> "$RUNNER_TEMP/head-bucket-error.txt"; then
            echo "::error::The bucket already exists. No changes will be made to it."
            exit 1
          fi
          if ! grep -Eq '\(404\).*HeadBucket' "$RUNNER_TEMP/head-bucket-error.txt"; then
            cat "$RUNNER_TEMP/head-bucket-error.txt" >&2
            echo "::error::Cannot confirm that the bucket is absent. Stopping without creating or configuring it."
            exit 1
          fi

      - name: Create bucket
        id: create
        run: |
          # us-east-1 requires no LocationConstraint.
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

      - name: Enable versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            --versioning-configuration Status=Enabled

      - name: Apply lifecycle configuration
        run: |
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "$BUCKET_NAME" \
            --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            --lifecycle-configuration file://Rules/s3-lifecycle.json

      - name: Verify bucket configuration
        run: |
          aws s3api get-bucket-location --bucket "$BUCKET_NAME" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.LocationConstraint == null'
          aws s3api get-public-access-block --bucket "$BUCKET_NAME" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls == true and .IgnorePublicAcls == true and .BlockPublicPolicy == true and .RestrictPublicBuckets == true'
          aws s3api get-bucket-versioning --bucket "$BUCKET_NAME" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            | jq -e '.Status == "Enabled"'
          aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET_NAME" --expected-bucket-owner "$EXPECTED_ACCOUNT" \
            > "$RUNNER_TEMP/lifecycle-actual.json"
          jq -e --slurpfile expected Rules/s3-lifecycle.json \
            '(.Rules | sort_by(.ID)) == ($expected[0].Rules | sort_by(.ID))' \
            "$RUNNER_TEMP/lifecycle-actual.json"
          printf 'Created and verified bucket `%s` in `%s`.\n' "$BUCKET_NAME" "$AWS_REGION" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure without deleting resources
        if: ${{ failure() }}
        env:
          BUCKET_CREATED: ${{ steps.create.outputs.created }}
        run: |
          if [[ "$BUCKET_CREATED" == "true" ]]; then
            echo "::error::Bucket creation succeeded, but a later step failed. The bucket has been retained for investigation."
            printf 'Bucket `%s` was created but configuration or verification failed. Inspect the failed step. A rerun will stop because the bucket exists; repair it explicitly or remove it after inspection.\n' "$BUCKET_NAME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Workflow failed before bucket creation was confirmed. Review the failed step; if the create request was sent, check AWS before retrying."
          fi
