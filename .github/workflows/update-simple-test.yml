name: Update simple-test

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Select a lab to activate, or baseline to restore the healthy configuration"
        required: true
        type: choice
        options:
          - lab-01
          - lab-02
          - baseline

permissions:
  contents: read
  id-token: write

# Serialize with Terraform Provision/Decommission for this lab.
concurrency:
  group: terraform-eks-lab-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_PAGER: ""
  EXPECTED_ACCOUNT: "490224159848"
  CLUSTER_NAME: eks-learning-lab-lab-eks
  ECR_REPOSITORY: simple-test
  KUBECONFIG: ${{ github.workspace }}/.simple-test-kubeconfig

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490224159848:role/GitHubActionsSimpleTestRole
          aws-region: us-east-1

      - name: Verify AWS prerequisites
        run: |
          aws sts get-caller-identity | jq -e --arg account "$EXPECTED_ACCOUNT" '.Account == $account'
          aws eks describe-cluster --name "$CLUSTER_NAME" > "$RUNNER_TEMP/cluster.json"
          jq -e '.cluster.status == "ACTIVE"' "$RUNNER_TEMP/cluster.json"
          CLUSTER_VERSION=$(jq -r '.cluster.version' "$RUNNER_TEMP/cluster.json")
          [[ "$CLUSTER_VERSION" =~ ^1\.[0-9]+$ ]]
          echo "CLUSTER_VERSION=$CLUSTER_VERSION" >> "$GITHUB_ENV"

      - name: Install matching kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL "https://dl.k8s.io/release/stable-$CLUSTER_VERSION.txt")
          [[ "$KUBECTL_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/kubectl-bin"
          cd "$RUNNER_TEMP/kubectl-bin"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/kubectl-bin" >> "$GITHUB_PATH"

      - name: Verify existing application
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          kubectl auth can-i patch deployments.apps -n simple-test | grep -qx yes
          kubectl -n simple-test get deployment simple-test -o json > "$RUNNER_TEMP/current.json"
          jq -e '.spec.template.spec.containers | length == 1' "$RUNNER_TEMP/current.json"
          if jq -e '.metadata.annotations["sre-lab/active"] == "lab-03" or .metadata.annotations["sre-lab/active"] == "lab-04" or .metadata.annotations["sre-lab/active"] == "lab-05"' "$RUNNER_TEMP/current.json" > /dev/null; then
            echo "::error::Use the active Run SRE lab workflow with restore before updating the application."
            exit 1
          fi
          IMAGE=$(jq -r '.spec.template.spec.containers[0].image' "$RUNNER_TEMP/current.json")
          [[ "$IMAGE" =~ ^$EXPECTED_ACCOUNT\.dkr\.ecr\.$AWS_REGION\.amazonaws\.com/simple-test@sha256:[a-f0-9]{64}$ ]]
          case "$CONFIGURATION" in
            lab-01|lab-02)
              kubectl -n simple-test rollout status deployment/simple-test --timeout=60s
              ;;
            baseline) ;;
            *) exit 1 ;;
          esac

      - name: Apply selected configuration
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          PATCH="kubernetes/simple-test/labs/$CONFIGURATION.json"
          kubectl -n simple-test patch deployment simple-test --type=strategic --patch-file "$PATCH" --dry-run=server > /dev/null
          kubectl -n simple-test patch deployment simple-test --type=strategic --patch-file "$PATCH"
          printf 'Configuration `%s` applied. Existing image, Service and HPA retained. No automatic rollback.\n' "$CONFIGURATION" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify rollout
        run: kubectl -n simple-test rollout status deployment/simple-test --timeout=360s

      - name: Verify HTTP response
        run: |
          kubectl -n simple-test port-forward service/simple-test 18081:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18081/healthz
          curl --fail --silent --show-error http://127.0.0.1:18081/ | grep -q 'simple-test is running'

      - name: Collect failure evidence
        if: ${{ failure() }}
        run: |
          if [[ -f "$KUBECONFIG" ]]; then
            kubectl -n simple-test get deployment,replicaset,pods,service,hpa || true
          fi
          echo "::error::Update did not complete successfully. Inspect the first failed step and Kubernetes evidence. Resources are retained for investigation."
          echo "A failed rollout may be part of the exercise; authentication, authorization and patch failures are not successful incident activation." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary kubeconfig
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
